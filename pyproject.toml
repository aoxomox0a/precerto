[project]
name = "scm-smmatt-od"
version = "0.1.0"
description = "Integrated Diagnostic Decision Support System (DDSS)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "neo4j>=5.14.0",
    "scispacy>=0.5.3",
    "spacy>=3.7.2",
    "fhirpy>=2.0.5",
    "faster-whisper>=1.2.1",
    "en-core-sci-sm",
    "sqlalchemy>=2.0.49",
    "kuzu>=0.11.3",
    "pandas>=2.3.3",
    "httpx>=0.28.1",
    "en-core-sci-lg",
    "negspacy>=1.0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "black>=23.12.0",
    "flake8>=6.1.0",
]

[tool.uv.sources]
en-core-sci-sm = { url = "https://s3-us-west-2.amazonaws.com/ai2-s2-scispacy/releases/v0.5.4/en_core_sci_sm-0.5.4.tar.gz" }
en-core-sci-lg = { url = "https://s3-us-west-2.amazonaws.com/ai2-s2-scispacy/releases/v0.5.4/en_core_sci_lg-0.5.4.tar.gz" }
